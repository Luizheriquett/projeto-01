<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>ChatPatty — voz e tela em tempo real</title>
  <meta name="description" content="ChatPatty: chat de voz com compartilhamento de tela em tempo real, direto do navegador." />
  <meta name="theme-color" content="#060916" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <!-- ===================== TELA: ENTRADA (landing / lobby) ===================== -->
  <main id="view-landing" class="view view-landing">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="landing-card card">
      <div class="brand">
        <img src="/assets/logo.png" alt="ChatPatty" class="brand-logo" />
        <div class="brand-text">
          <span class="brand-name">ChatPatty</span>
          <span class="brand-tag">voz e tela, em tempo real</span>
        </div>
      </div>

      <div class="signal-divider" aria-hidden="true">
        <svg viewBox="0 0 400 16" preserveAspectRatio="none"><path d="M0 8 H30 M42 8 H50 M62 8 H100 M112 8 H126 M138 8 H150 M162 8 H190 M202 8 H210 M222 8 H260 M272 8 H286 M298 8 H320 M332 8 H360 M372 8 H400" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-dasharray="18 8 4 8"/><defs><linearGradient id="g" x1="0" y1="0" x2="400" y2="0"><stop offset="0" stop-color="#1E40FF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs></svg>
      </div>

      <div id="lobby-form">
        <label class="field-label" for="input-name">Seu nome</label>
        <input id="input-name" class="text-input" type="text" maxlength="24" placeholder="Como podemos te chamar?" autocomplete="off" />

        <label class="field-label">Escolha um avatar</label>
        <div id="avatar-picker" class="avatar-picker"></div>

        <div class="lobby-actions">
          <button id="btn-create-room" class="btn btn-primary">
            <span>Criar sala nova</span>
          </button>

          <div class="divider-or"><span>ou</span></div>

          <div class="join-row">
            <input id="input-room-code" class="text-input" type="text" placeholder="Código da sala" maxlength="12" autocomplete="off" />
            <button id="btn-join-room" class="btn btn-secondary">Entrar</button>
          </div>
        </div>

        <p id="lobby-error" class="form-error" role="alert"></p>
      </div>
    </div>

    <p class="landing-footnote">Sem cadastro. O link da sala é tudo que você precisa compartilhar.</p>
  </main>

  <!-- ===================== TELA: SALA ===================== -->
  <div id="view-room" class="view view-room" hidden>

    <!-- Topo: info da sala + status de conexão -->
    <header class="room-topbar">
      <div class="room-topbar-left">
        <img src="/assets/logo.png" alt="" class="topbar-logo" />
        <div class="room-info">
          <span class="room-name">Sala <strong id="room-id-label">—</strong></span>
          <span id="connection-status" class="connection-status">
            <span class="status-dot"></span><span class="status-text">conectando…</span>
          </span>
        </div>
      </div>
      <div class="room-topbar-right">
        <button id="btn-copy-link" class="btn btn-ghost btn-sm" title="Copiar link da sala">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17 7h-3a1 1 0 100 2h3a3 3 0 010 6h-3a1 1 0 100 2h3a5 5 0 000-10zM7 15h3a1 1 0 100-2H7a3 3 0 010-6h3a1 1 0 100-2H7a5 5 0 000 10zm1-4h8v-2H8z"/></svg>
          <span>Copiar link</span>
        </button>
        <button id="btn-toggle-participants" class="btn btn-ghost btn-sm btn-icon-only mobile-only" title="Participantes">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </button>
      </div>
    </header>

    <div class="room-body">
      <!-- Sidebar de participantes (desktop) / painel deslizante (mobile) -->
      <aside id="participants-panel" class="participants-panel">
        <div class="participants-panel-header">
          <span>Participantes</span>
          <span id="participants-count" class="participants-count">0</span>
          <button id="btn-close-participants" class="btn btn-ghost btn-icon-only mobile-only" aria-label="Fechar">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.88 18.3 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.3-6.3z"/></svg>
          </button>
        </div>
        <ul id="participants-list" class="participants-list"></ul>
      </aside>
      <div id="participants-scrim" class="participants-scrim mobile-only"></div>

      <!-- Palco principal -->
      <section class="stage">
        <div id="stage-empty" class="stage-empty">
          <div class="stage-empty-ring"></div>
          <p>Ninguém está compartilhando tela ainda.</p>
          <p class="stage-empty-sub">Toque em <strong>Compartilhar tela</strong> para começar.</p>
        </div>

        <div id="screen-share-view" class="screen-share-view" hidden>
          <video id="screen-share-video" autoplay playsinline></video>
          <div class="screen-share-badge">
            <span id="screen-share-owner-name">—</span>
            <span id="quality-badge" class="quality-badge">—</span>
          </div>
          <button id="btn-fullscreen" class="btn btn-ghost btn-sm screen-fullscreen-btn" title="Tela cheia">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>

        <!-- Grade de participantes (avatares + indicador de fala) -->
        <div id="speaker-grid" class="speaker-grid"></div>
      </section>
    </div>

    <!-- Controles inferiores -->
    <footer class="control-bar">
      <div class="control-bar-inner">
        <button id="btn-mic" class="control-btn control-btn-toggle" data-active="false" title="Ativar microfone">
          <svg class="icon-on" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 14a3 3 0 003-3V6a3 3 0 10-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 11h-2a5 5 0 01-.24 1.52l1.46 1.46A6.97 6.97 0 0019 11zM4.27 3L3 4.27l6 6V11a3 3 0 003 3c.16 0 .31-.02.46-.05l1.06 1.06A4.98 4.98 0 0112 15a5 5 0 01-5-5H5a7 7 0 006 6.92V21h2v-3.08c.91-.13 1.76-.45 2.5-.93L19.73 21 21 19.73 4.27 3zM15 11a3 3 0 00-3-3v.18l2.97 2.97c.02-.05.03-.1.03-.15z"/></svg>
          <span class="control-label">Microfone</span>
        </button>

        <button id="btn-screen-share" class="control-btn control-btn-toggle" data-active="false" title="Compartilhar tela">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 18a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
          <span class="control-label">Tela</span>
        </button>

        <button id="btn-devices" class="control-btn" title="Dispositivos de áudio">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 00.12-.61l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.49.49 0 00-.5-.42h-3.84a.49.49 0 00-.5.42l-.36 2.54c-.6.24-1.14.56-1.62.94l-2.39-.96a.5.5 0 00-.6.22L2.66 8.87a.5.5 0 00.12.61l2.03 1.58c-.05.3-.08.63-.08.94s.02.64.07.94l-2.03 1.58a.5.5 0 00-.12.61l1.92 3.32c.12.22.39.3.6.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .46-.18.5-.42l.36-2.54c.6-.24 1.13-.56 1.62-.94l2.39.96c.22.08.49 0 .6-.22l1.92-3.32a.5.5 0 00-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
          <span class="control-label">Dispositivos</span>
        </button>

        <div id="leave-wrap" class="leave-wrap">
          <button id="btn-leave" class="control-btn control-btn-danger" title="Sair da sala">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17 7l-1.41 1.41L17.17 10H8v2h9.17l-1.58 1.59L17 15l4-4-4-4zM4 5h8V3H4a2 2 0 00-2 2v14a2 2 0 002 2h8v-2H4V5z"/></svg>
            <span class="control-label">Sair</span>
          </button>
        </div>
      </div>
    </footer>

    <!-- Painel de dispositivos (popover) -->
    <div id="devices-panel" class="devices-panel" hidden>
      <div class="devices-panel-section">
        <label for="select-mic">Microfone</label>
        <select id="select-mic"></select>
      </div>
      <div class="devices-panel-section">
        <label for="select-speaker">Saída de áudio</label>
        <select id="select-speaker"></select>
      </div>
      <div class="devices-panel-section">
        <label for="select-quality">Qualidade da tela</label>
        <select id="select-quality">
          <option value="auto">Automática (recomendado)</option>
          <option value="1440">1440p · 2K</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
        </select>
      </div>
      <div class="devices-panel-section">
        <label for="select-fps">Taxa de quadros</label>
        <select id="select-fps">
          <option value="30">30 FPS</option>
          <option value="60">60 FPS</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Toasts / notificações -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- video oculto usado apenas como fonte de captura local -->
  <audio id="remote-audio-sink" hidden></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
